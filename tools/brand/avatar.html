<!doctype html><meta charset="utf-8" />
<!-- Аватарка бота 1024×1024. Книжный червь как таблица из старинного анатомического атласа: гравюра со штриховкой,
     лёгкая акварельная подкраска, поперечный разрез, выноски, латинская подпись. -->
<style>html,body{margin:0}canvas{display:block}</style>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
{
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1024, CX = 512, CY = 512;
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = '#3a2a1d';
const SERIF = '"Liberation Serif", "FreeSerif", serif';

// Бумага: тёплая, с пятнами времени и зерном.
let g = ctx.createRadialGradient(CX, CY - 60, 80, CX, CY, 720);
g.addColorStop(0, '#f3ead5');
g.addColorStop(0.7, '#e8dbbd');
g.addColorStop(1, '#cdb88f');
ctx.fillStyle = g;
ctx.fillRect(0, 0, W, W);
for (let i = 0; i < 14; i++) {
  const x = rnd() * W, y = rnd() * W, r = 10 + rnd() * 40;
  g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(150,100,50,.14)');
  g.addColorStop(1, 'rgba(150,100,50,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// Круглая рамка таблицы — под круглую аватарку.
ctx.strokeStyle = INK;
ctx.lineWidth = 3;
ctx.beginPath(); ctx.arc(CX, CY, 478, 0, Math.PI * 2); ctx.stroke();
ctx.lineWidth = 1.2;
ctx.beginPath(); ctx.arc(CX, CY, 468, 0, Math.PI * 2); ctx.stroke();
ctx.beginPath(); ctx.arc(CX, CY, 418, 0, Math.PI * 2); ctx.stroke();
// Надпись по дуге
function arcText(text, r, center, size, inside = false) {
  ctx.save();
  ctx.font = `${size}px ${SERIF}`;
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const chars = [...text];
  const widths = chars.map((ch) => ctx.measureText(ch).width + size * 0.18);
  const total = widths.reduce((a, b) => a + b, 0);
  let a = center - (inside ? -1 : 1) * total / r / 2;
  for (let i = 0; i < chars.length; i++) {
    const da = widths[i] / r;
    const m = a + (inside ? -1 : 1) * da / 2;
    ctx.save();
    ctx.translate(CX + Math.cos(m) * r, CY + Math.sin(m) * r);
    ctx.rotate(m + (inside ? -Math.PI / 2 : Math.PI / 2));
    ctx.fillText(chars[i], 0, 0);
    ctx.restore();
    a += (inside ? -1 : 1) * da;
  }
  ctx.restore();
}
arcText('VERMIS · LIBRORUM', 443, -Math.PI / 2, 34);
arcText('TAB. I · ANATOMIA', 443, Math.PI / 2, 26, true);
// звёздочки-разделители на рамке
for (const a of [Math.PI * 0.08, Math.PI * 0.92]) {
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(CX + Math.cos(a) * 443, CY + Math.sin(a) * 443, 4, 0, Math.PI * 2); ctx.fill();
}

// Обрезаем всё дальнейшее кругом внутри рамки.
ctx.save();
ctx.beginPath(); ctx.arc(CX, CY, 414, 0, Math.PI * 2); ctx.clip();

// Книга: срез страниц тонкими линиями, крышки штрихом.
const bx0 = 250, bx1 = 790, by0 = 650, by1 = 810;
ctx.strokeStyle = INK;
ctx.lineWidth = 2.4;
ctx.strokeRect(bx0, by0, bx1 - bx0, by1 - by0);
for (let y = by0 + 4; y < by1; y += 4.2) {
  ctx.strokeStyle = `rgba(58,42,29,${0.25 + rnd() * 0.3})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(bx0 + 2, y); ctx.lineTo(bx1 - 2, y + (rnd() - 0.5)); ctx.stroke();
}
// верхняя крышка в перспективе с перекрёстной штриховкой
ctx.fillStyle = '#e8dbbd';
ctx.beginPath();
ctx.moveTo(bx0 - 12, by0); ctx.lineTo(bx0 + 40, by0 - 46); ctx.lineTo(bx1 + 40, by0 - 46); ctx.lineTo(bx1 + 12, by0); ctx.closePath();
ctx.fill();
ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
ctx.save(); ctx.clip();
for (let x = bx0 - 60; x < bx1 + 80; x += 9) {
  ctx.lineWidth = 0.9; ctx.strokeStyle = 'rgba(58,42,29,.45)';
  ctx.beginPath(); ctx.moveTo(x, by0); ctx.lineTo(x + 46, by0 - 46); ctx.stroke();
}
ctx.restore();
// нижняя крышка
ctx.lineWidth = 2.4;
ctx.beginPath(); ctx.moveTo(bx0 - 12, by1); ctx.lineTo(bx1 + 12, by1); ctx.lineTo(bx1 + 12, by1 + 16); ctx.lineTo(bx0 - 12, by1 + 16); ctx.closePath(); ctx.stroke();
// правый торец — тень штрихом
ctx.beginPath(); ctx.moveTo(bx1, by0); ctx.lineTo(bx1 + 40, by0 - 46); ctx.lineTo(bx1 + 40, by1 - 30); ctx.lineTo(bx1, by1); ctx.closePath();
ctx.fillStyle = '#e2d3b1'; ctx.fill(); ctx.stroke();
for (let y = by0 - 30; y < by1; y += 6) {
  ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(58,42,29,.5)';
  ctx.beginPath(); ctx.moveTo(bx1 + 2, y + 30); ctx.lineTo(bx1 + 38, y - 10); ctx.stroke();
}
// ходы
function tunnel(x, y, rx, ry) {
  ctx.fillStyle = '#2d2016';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.ellipse(x, y, rx + 6, ry + 5, 0, 0, Math.PI * 2); ctx.stroke();
}
tunnel(330, 760, 15, 12);
tunnel(712, 700, 12, 10);
const H = { x: 520, y: 708, rx: 44, ry: 36 };
tunnel(H.x, H.y, H.rx, H.ry);

// Червь: силуэт, акварельная подкраска, кольца, штриховка теневой стороны.
function bez(p, t) {
  const u = 1 - t;
  return [0, 1].map((k) => u * u * u * p[0][k] + 3 * u * u * t * p[1][k] + 3 * u * t * t * p[2][k] + t * t * t * p[3][k]);
}
const path = [[H.x, H.y + 10], [560, 430], [215, 560], [330, 250]];
const N = 500, w0 = 74, w1 = 56;
const pts = [];
for (let i = 0; i <= N; i++) {
  const t = i / N;
  const [x, y] = bez(path, t);
  let w = w0 + (w1 - w0) * t;
  const band = Math.max(0, 1 - Math.abs(t - 0.64) / 0.075);
  w *= 1 + 0.12 * band;
  if (t > 0.9) w *= 0.25 + 0.75 * Math.sqrt((1 - t) / 0.1);
  pts.push({ x, y, w, t, band });
}
const L = { x: -0.5, y: -0.866 };
pts.forEach((p, i) => {
  const q = pts[Math.min(i + 1, N)], o = pts[Math.max(i - 1, 0)];
  const nx = -(q.y - o.y), ny = q.x - o.x, l = Math.hypot(nx, ny) || 1;
  p.nx = nx / l; p.ny = ny / l; p.lit = p.nx * L.x + p.ny * L.y;
});
const body = new Path2D();
pts.forEach((p, i) => (i ? body.lineTo : body.moveTo).call(body, p.x + p.nx * p.w / 2, p.y + p.ny * p.w / 2));
// кончик головы — закруглённый конус вперёд по ходу тела
const tip = pts[N], pre = pts[N - 8];
const tx = tip.x - pre.x, ty = tip.y - pre.y, tl = Math.hypot(tx, ty) || 1;
body.quadraticCurveTo(tip.x + (tx / tl) * 22, tip.y + (ty / tl) * 22, tip.x - tip.nx * tip.w / 2, tip.y - tip.ny * tip.w / 2);
for (let i = N; i >= 0; i--) { const p = pts[i]; body.lineTo(p.x - p.nx * p.w / 2, p.y - p.ny * p.w / 2); }
body.closePath();

// червь выходит из хода: прячем всё, что ниже края хода и вне его
ctx.save();
ctx.beginPath(); ctx.rect(0, 0, W, H.y); ctx.ellipse(H.x, H.y, H.rx, H.ry, 0, 0, Math.PI * 2); ctx.clip();
ctx.fillStyle = '#ecc9bb';
ctx.fill(body);
ctx.fillStyle = 'rgba(206,120,106,.6)';
ctx.fill(body);
ctx.save();
ctx.clip(body);
// поясок — гуще цветом и пунктиром
const b0 = Math.round(0.565 * N), b1 = Math.round(0.715 * N);
ctx.save();
ctx.strokeStyle = 'rgba(200,110,80,.35)';
ctx.lineCap = 'butt';
ctx.lineWidth = 120;
ctx.beginPath();
for (let i = b0; i <= b1; i++) (i === b0 ? ctx.moveTo : ctx.lineTo).call(ctx, pts[i].x, pts[i].y);
ctx.stroke();
ctx.restore();
for (let k = 0; k < 900; k++) {
  const p = pts[b0 + Math.floor(rnd() * (b1 - b0))];
  const o = (rnd() - 0.5) * p.w;
  ctx.fillStyle = 'rgba(58,42,29,.5)';
  ctx.fillRect(p.x + p.nx * o + (rnd() - 0.5) * 6, p.y + p.ny * o + (rnd() - 0.5) * 6, 1.4, 1.4);
}
// кольца и штриховка в тени: короткие штрихи от теневой кромки
let i = 6;
while (i < N - 14) {
  const p = pts[i];
  const a = Math.atan2(p.ny, p.nx);
  if (p.band < 0.5) {
    ctx.strokeStyle = 'rgba(58,42,29,.85)';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.w / 2, p.w * 0.1, a, 0, Math.PI); ctx.stroke();
  }
  const s = -Math.sign(p.lit || 1); // теневая сторона
  for (let h = 0; h < 3; h++) {
    const q = pts[Math.min(N, i + h * 2 + 1)];
    const len = q.w * (0.18 + 0.2 * (1 - Math.abs(q.lit)) + 0.12 * Math.max(0, -q.lit * s));
    ctx.strokeStyle = 'rgba(58,42,29,.55)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(q.x + q.nx * s * q.w / 2, q.y + q.ny * s * q.w / 2);
    ctx.lineTo(q.x + q.nx * s * (q.w / 2 - len), q.y + q.ny * s * (q.w / 2 - len));
    ctx.stroke();
  }
  i += Math.max(4, Math.round(p.w * 0.13));
}
ctx.restore();
ctx.strokeStyle = INK;
ctx.lineWidth = 3.4;
ctx.stroke(body);
ctx.restore();
// передний край хода поверх червя
ctx.lineWidth = 2; ctx.strokeStyle = INK;
ctx.beginPath(); ctx.ellipse(H.x, H.y, H.rx + 6, H.ry + 5, 0, 0.05 * Math.PI, 0.95 * Math.PI); ctx.stroke();

// Линия разреза A—A через тело.
const sp = pts[Math.round(0.4 * N)];
ctx.setLineDash([10, 6]);
ctx.lineWidth = 1.4;
ctx.beginPath();
ctx.moveTo(sp.x - sp.nx * 70, sp.y - sp.ny * 70);
ctx.lineTo(sp.x + sp.nx * 70, sp.y + sp.ny * 70);
ctx.stroke();
ctx.setLineDash([]);
ctx.font = `italic 22px ${SERIF}`;
ctx.fillStyle = INK;
ctx.fillText('A', sp.x - sp.nx * 86 - 6, sp.y - sp.ny * 86 + 6);
ctx.fillText('A', sp.x + sp.nx * 78, sp.y + sp.ny * 78 + 6);

// Поперечный разрез A—A.
const S = { x: 735, y: 360, r: 92 };
function ring(r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(S.x, S.y, r, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke(); }
ring(S.r, 'rgba(214,138,124,.5)');         // кутикула и эпидермис
ring(S.r - 8, 'rgba(226,160,140,.55)');    // кольцевые мышцы
for (let a = 0; a < Math.PI * 2; a += 0.09) {
  ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(58,42,29,.6)';
  ctx.beginPath(); ctx.moveTo(S.x + Math.cos(a) * (S.r - 8), S.y + Math.sin(a) * (S.r - 8)); ctx.lineTo(S.x + Math.cos(a) * (S.r - 18), S.y + Math.sin(a) * (S.r - 18)); ctx.stroke();
}
ring(S.r - 18, 'rgba(196,112,98,.5)');     // продольные мышцы
for (let a = 0; a < Math.PI * 2; a += 0.26) {
  ctx.lineWidth = 0.9; ctx.strokeStyle = 'rgba(58,42,29,.55)';
  ctx.beginPath(); ctx.moveTo(S.x + Math.cos(a) * (S.r - 18), S.y + Math.sin(a) * (S.r - 18)); ctx.lineTo(S.x + Math.cos(a + 0.08) * (S.r - 34), S.y + Math.sin(a + 0.08) * (S.r - 34)); ctx.stroke();
}
ring(S.r - 34, '#f1e6cf');                 // полость тела
// кишка с тифлозолем
ctx.fillStyle = 'rgba(190,150,90,.55)';
ctx.beginPath(); ctx.arc(S.x, S.y + 4, 30, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
ctx.fillStyle = '#f1e6cf';
ctx.beginPath(); ctx.moveTo(S.x - 8, S.y - 26); ctx.quadraticCurveTo(S.x, S.y + 10, S.x + 8, S.y - 26); ctx.fill(); ctx.stroke();
// спинной и брюшной сосуды, нервная цепочка
for (const [dx, dy, r, f] of [[0, -46, 7, '#b54a3c'], [0, 42, 6, '#b54a3c'], [0, 58, 7, '#e8d9b5']]) {
  ctx.fillStyle = f; ctx.beginPath(); ctx.arc(S.x + dx, S.y + dy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
// подпись разреза
ctx.fillStyle = INK;
ctx.font = `italic 22px ${SERIF}`;
ctx.textAlign = 'center';
ctx.fillText('Sect. A—A', S.x, S.y + S.r + 30);

// Выноски с буквами.
function label(from, to, letter) {
  ctx.lineWidth = 1; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]); ctx.stroke();
  ctx.beginPath(); ctx.arc(from[0], from[1], 2.5, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
  ctx.font = `italic 26px ${SERIF}`;
  ctx.textAlign = 'center';
  ctx.fillText(letter, to[0] + (to[0] < from[0] ? -12 : 12), to[1] + 8);
}
label([tip.x - 4, tip.y - 12], [262, 220], 'a');
const cl = pts[Math.round(0.64 * N)];
label([cl.x - 20, cl.y], [170, 470], 'b');
const sg = pts[Math.round(0.22 * N)];
label([sg.x + 30, sg.y], [660, 560], 'c');
label([H.x + 46, H.y + 10], [640, 760], 'd');
label([S.x - S.r + 12, S.y - 20], [600, 250], 'e');
label([S.x + 8, S.y + 4], [850, 330], 'f');
ctx.restore(); // круг

// Зерно поверх всего.
const img = ctx.getImageData(0, 0, W, W);
for (let k = 0; k < img.data.length; k += 4) {
  const n = (rnd() - 0.5) * 18;
  img.data[k] += n; img.data[k + 1] += n; img.data[k + 2] += n;
}
ctx.putImageData(img, 0, 0);
}
</script>
