<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Маскот: книжный червячок в очках выглядывает из раскрытой книги. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#2c5279"/><stop offset="1" stop-color="#16263a"/>
    </radialGradient>
    <clipPath id="above"><rect width="1024" height="742"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Книга: обложка и страницы -->
  <path d="M138 676 Q330 628 512 690 L512 912 Q330 860 138 900 Z" fill="#e04e43"/>
  <path d="M886 676 Q694 628 512 690 L512 912 Q694 860 886 900 Z" fill="#e04e43"/>
  <path d="M160 660 Q330 614 512 676 L512 890 Q330 836 160 878 Z" fill="#f3efe6"/>
  <path d="M864 660 Q694 614 512 676 L512 890 Q694 836 864 878 Z" fill="#e6dfd0"/>
  <g stroke="#a99f8d" stroke-width="10" stroke-linecap="round" opacity=".5">
    <path d="M218 712 Q300 690 380 704"/><path d="M218 760 Q300 738 400 754"/><path d="M218 808 Q300 786 380 800"/>
    <path d="M644 704 Q724 690 806 712"/><path d="M624 754 Q724 738 806 760"/><path d="M644 800 Q724 786 806 808"/>
  </g>
  <!-- Ход в страницах, откуда вылез червячок -->
  <ellipse cx="512" cy="742" rx="74" ry="30" fill="#3a1f1a"/>

  <!-- Тело: гладкая изогнутая трубка с обводкой и полосками-колечками -->
  <g clip-path="url(#above)">
    <path id="body" d="M512 760 C512 640 650 610 624 500 C604 418 470 420 486 330" fill="none"
      stroke="#16263a" stroke-width="152" stroke-linecap="round"/>
    <path d="M512 760 C512 640 650 610 624 500 C604 418 470 420 486 330" fill="none"
      stroke="#9bd36a" stroke-width="128" stroke-linecap="round"/>
    <path d="M512 760 C512 640 650 610 624 500 C604 418 470 420 486 330" fill="none"
      stroke="#c3ec97" stroke-width="40" stroke-linecap="round" opacity=".55" transform="translate(-22 -6)"/>
    <g stroke="#7fb352" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M458 660 Q512 676 566 650"/><path d="M548 580 Q600 600 652 568"/>
      <path d="M560 500 Q616 512 668 486"/><path d="M520 432 Q568 452 616 424"/>
    </g>
  </g>
  <!-- Передний край хода поверх тела -->
  <path d="M438 742 A74 30 0 0 0 586 742" fill="none" stroke="#f3efe6" stroke-width="12"/>

  <!-- Голова -->
  <circle cx="486" cy="300" r="138" fill="#16263a"/>
  <circle cx="486" cy="300" r="126" fill="#9bd36a"/>
  <ellipse cx="440" cy="236" rx="44" ry="26" fill="#c3ec97" opacity=".7" transform="rotate(-20 440 236)"/>
  <!-- Щёки -->
  <circle cx="404" cy="354" r="22" fill="#ff8f80" opacity=".8"/>
  <circle cx="574" cy="354" r="22" fill="#ff8f80" opacity=".8"/>
  <!-- Очки -->
  <circle cx="436" cy="296" r="46" fill="#fff" stroke="#16263a" stroke-width="12"/>
  <circle cx="540" cy="296" r="46" fill="#fff" stroke="#16263a" stroke-width="12"/>
  <path d="M478 288 Q488 276 498 288" fill="none" stroke="#16263a" stroke-width="11" stroke-linecap="round"/>
  <path d="M390 290 L364 280 M586 290 L610 280" stroke="#16263a" stroke-width="11" stroke-linecap="round"/>
  <!-- Глаза смотрят вниз, в книгу -->
  <circle cx="446" cy="312" r="18" fill="#16263a"/>
  <circle cx="548" cy="312" r="18" fill="#16263a"/>
  <circle cx="452" cy="305" r="6" fill="#fff"/>
  <circle cx="554" cy="305" r="6" fill="#fff"/>
  <!-- Улыбка -->
  <path d="M458 378 Q490 402 522 378" fill="none" stroke="#16263a" stroke-width="11" stroke-linecap="round"/>
</svg>
